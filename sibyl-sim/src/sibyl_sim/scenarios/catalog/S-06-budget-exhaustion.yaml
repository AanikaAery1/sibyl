# S-06 Budget exhaustion mid-month (ML §8.2): spend already at 0.97 of budget; normal traffic.
# L4 at the first evaluation, R5 at the crossing; tier 1 quarantine needs approval and the
# agent's declared fail mode holds until the decision.
# Spend is priced at ingest from the seeded model prices (gpt-5.4: 2.50 USD in, 15 USD out per
# 1M tokens). "Mid-month" is 425 minutes of warm-up history (~4.59 USD) under a 4.73 USD month:
# 0.970 of budget at t=0, and normal calls (~0.0012 USD each at ~1/s) cross it at t~125 (onset
# 120; tests/scenarios/test_budget_calibration.py recomputes both). The history reaches ~7 h back:
# a run in the first 7 hours of a month (UTC) loses part of it to the previous month.
id: S-06
title: Budget exhaustion mid-month, tier 1
requires: [P, S]
gate_class: ramp
duration_s: 600
tenants:
  meridian:
    agents:
      billing-agent: hot   # tier 1, openai-stub, seeded budget 5000 USD/month
warmup_agents:
  billing-agent: 425
budgets:
  billing-agent: "4.7300"
labels:
  - {agent: billing-agent, kind: onset, t: 120, failure_mode: budget_exhaustion}
expect:
  - predict: {agent: billing-agent, rule: L4, by_t: 30}
  - detect: {agent: billing-agent, rule: R5, by_t: 600}
  - tier_gate: {agent: billing-agent, mode: approval}
  - explainable: {}
  - quiet: {tenant: northstar}
