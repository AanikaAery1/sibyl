[project]
name = "sibyl-sim"
version = "0.1.0.dev0"
description = "Sibyl: simulator and evaluation harness (dev-only, D38)"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = ["sibyl-schemas", "sibyl-sdk", "httpx>=0.27", "pyyaml>=6.0", "starlette>=0.40", "uvicorn>=0.32", "cryptography>=43"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl_sim"]
