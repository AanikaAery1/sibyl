openapi: 3.1.0
info:
  title: Sibyl Control Plane API
  version: 1.1.0-phase1
  description: Tenant-scoped REST + SSE, ingest and gateway control routes. Errors are RFC 9457 problem
    details (https://sibyl.dev/problems/<code>). Generated from openapi/sibyl_openapi; do not edit by
    hand.
x-sibyl-contract-version: 1.1.0
servers:
- url: https://{host}/api/v1
  description: Control plane
  variables:
    host:
      default: sibyl.local
tags:
- name: auth
- name: tenancy
- name: keys
- name: registry
- name: policy
- name: credentials
- name: snapshot
- name: reads
- name: sse
- name: incidents
- name: approvals
- name: killswitch
- name: queue
- name: alerts
- name: governance
- name: action_gate
- name: ingest
- name: drift
- name: sentinel
- name: monitors
- name: findings
paths:
  /auth/login:
    get:
      operationId: authLogin
      summary: Start the tenant's OIDC code flow (PKCE)
      tags:
      - auth
      x-sibyl-module: auth
      x-sibyl-scope: public
      x-sibyl-audit: none
      x-sibyl-audit-when: never
      x-sibyl-principals:
      - anonymous
      x-sibyl-key-scopes: []
      x-sibyl-step-up: never
      x-sibyl-object-rules: []
      x-sibyl-idempotency: none
      x-sibyl-if-match: none
      x-sibyl-rate-limit: auth
      x-sibyl-problems:
        '404':
        - not_found
        - tenant_unknown
        '422':
        - validation_failed
        '429':
        - rate_limited
      security: []
      parameters:
      - name: tenant
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        required: true
      - name: return_to
        in: query
        schema:
          type: string
          maxLength: 2048
      responses:
        '302':
          description: Redirect to the tenant's issuer
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/callback:
    get:
      operationId: authCallback
      summary: OIDC callback; creates the session
      tags:
      - auth
      x-sibyl-module: auth
      x-sibyl-scope: public
      x-sibyl-audit:
      - access.login
      - access.login_failed
      - user.provisioned
      - access.step_up
      x-sibyl-audit-when: always
      x-sibyl-principals:
      - anonymous
      x-sibyl-key-scopes: []
      x-sibyl-step-up: never
      x-sibyl-object-rules: []
      x-sibyl-idempotency: none
      x-sibyl-if-match: none
      x-sibyl-rate-limit: auth
      x-sibyl-problems:
        '401':
        - unauthenticated
        - oidc_failed
        '422':
        - validation_failed
        '429':
        - rate_limited
      description: 'Audit: user.provisioned on a JIT first login; access.step_up when it completes one.'
      security: []
      parameters:
      - name: code
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: state
        in: query
        schema:
          type: string
          maxLength: 512
      responses:
        '302':
          description: Session established; redirect to return_to
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/step-up:
    post:
      operationId: authStepUp
      summary: Re-run the code flow with prompt=login max_age=0
      tags:
      - auth
      x-sibyl-module: auth
      x-sibyl-scope: authenticated
      x-sibyl-audit:
      - access.step_up
      x-sibyl-audit-when: conditional
      x-sibyl-principals:
      - session
      - oidc
      x-sibyl-key-scopes: []
      x-sibyl-step-up: never
      x-sibyl-object-rules: []
      x-sibyl-idempotency: none
      x-sibyl-if-match: none
      x-sibyl-rate-limit: auth
      x-sibyl-problems:
        '401':
        - unauthenticated
        '403':
        - forbidden
        - break_glass_key_misuse
        '422':
        - validation_failed
        '429':
        - rate_limited
      description: 'Audit: written on the callback that completes the step-up.'
      security:
      - session: []
      - oidc: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnTo'
      responses:
        '302':
          description: Redirect to the issuer
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session
      tags:
      - auth
      x-sibyl-module: auth
      x-sibyl-scope: authenticated
      x-sibyl-audit:
      - access.logout
      x-sibyl-audit-when: always
      x-sibyl-principals:
      - session
      - oidc
      x-sibyl-key-scopes: []
      x-sibyl-step-up: never
      x-sibyl-object-rules: []
      x-sibyl-idempotency: none
      x-sibyl-if-match: none
      x-sibyl-rate-limit: auth
      x-sibyl-problems:
        '401':
        - unauthenticated
        '403':
        - forbidden
        - break_glass_key_misuse
        '429':
        - rate_limited
      security:
      - session: []
      - oidc: []
      responses:
        '204':
          description: Logged out
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Sibyl-Audit-Receipt:
              $ref: '#/components/headers/AuditReceipt'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/me:
    get:
      operationId: authMe
      summary: The calling principal
      tags:
      - auth
      x-sibyl-module: auth
      x-sibyl-scope: authenticated
      x-sibyl-audit: none
      x-sibyl-audit-when: never
      x-sibyl-principals:
