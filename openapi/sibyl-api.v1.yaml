        '428':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: sibyl_sess_<value> (console BFF, server-to-server)
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT (aud=sibyl-api)
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sbl_<env>_<prefix12>_<secret>
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1024
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  headers:
    ETag:
      schema:
        type: string
      description: Strong validator
    AuditReceipt:
      schema:
        type: string
        pattern: ^[0-9a-f-]{36}:\d+:[0-9a-f]{64}$
      description: <tenant>:<seq>:<hash>
    IdempotencyReplayed:
      schema:
        type: string
        enum:
        - 'true'
    Link:
      schema:
        type: string
      description: <…>; rel="next"
    Location:
      schema:
        type: string
        format: uri
    RequestId:
      schema:
        type: string
        maxLength: 128
    RateLimit:
      schema:
        type: string
    RateLimitPolicy:
      schema:
        type: string
    RetryAfter:
      schema:
        type: integer
        minimum: 0
    SnapshotKid:
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
      description: kid of the signing key (verify against the accepted key set)
    SnapshotSignature:
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{86}$
      description: base64url Ed25519 signature over the raw response bytes (B4)
    SnapshotVersion:
      schema:
        type: string
        pattern: ^[0-9]{1,19}$
      description: policy_snapshot_issue version of this snapshot (also the ETag)
  responses:
    Problem:
      description: RFC 9457 problem details
      headers:
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ActionCounter:
      type: object
      properties:
        key:
          type: string
        amount: &id011
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: decimal as a string
        max: *id011
        window_s:
          type: integer
          minimum: 1
        value:
          type:
          - string
          - 'null'
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: decimal as a string
        window_start: &id016
          $ref: '#/components/schemas/NullableTimestamp'
      required:
      - key
      - amount
      - max
      - window_s
    ActionDecision:
      type: object
      properties:
        effect: &id015
          type: string
          enum:
          - allow
          - escalate
          - block
        rule_id:
          type:
          - string
          - 'null'
        reason:
          type: string
        matched_paths:
          type: array
          items:
            type: string
        policy_id: &id017
          $ref: '#/components/schemas/NullableUuid'
        policy_version:
          type:
          - integer
          - 'null'
          minimum: 1
        counter:
          oneOf:
          - $ref: '#/components/schemas/ActionCounter'
          - type: 'null'
        sensitive:
          type: boolean
        hold_timeout_s:
          type:
          - integer
          - 'null'
          minimum: 1
        policy_state:
          type:
          - string
          - 'null'
          enum:
          - draft
          - approved
          - superseded
          - retired
          description: null for an unsaved draft
        evaluated_at: *id005
      required:
      - effect
      - rule_id
      - reason
      - policy_id
    ActionDecisionRequest:
      type: object
      properties:
        call_id: &id014
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,160}$
        agent_id: *id001
        source:
          type: string
          enum:
          - sdk
          - gateway
        policy_id: *id001
        policy_version:
          type: integer
          minimum: 1
        rule_id:
          type: string
          maxLength: 64
        tool: *id012
        counter_key:
          type: string
          minLength: 1
          maxLength: 200
        increment: &id013
          type: string
          pattern: ^[0-9]{1,30}(\.[0-9]{1,18})?$
        max: *id013
        window_s:
          type: integer
          minimum: 1
        args_sha256: &id018
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - call_id
      - agent_id
      - source
      - policy_id
      - policy_version
      - rule_id
      - tool
      - counter_key
      - increment
      - max
      - window_s
      - args_sha256
      description: sibyl_schemas.action_gate.ActionDecisionRequest; max and window_s are re-read from
        the control plane's copy of the rule
      additionalProperties: false
    ActionDecisionResult:
      type: object
      properties:
        call_id: *id014
        within_cap:
          type: boolean
          description: the counter was incremented only when true
        counter_value:
          type:
          - string
          - 'null'
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: decimal as a string
        agent_id: *id001
        effect: *id015
        policy_id: *id001
        policy_version:
          type: integer
          minimum: 1
        rule_id:
          type: string
        counter_key:
          type: string
        max:
          type:
          - string
          - 'null'
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: decimal as a string
        window_s:
          type: integer
          minimum: 1
        window_start: *id016
        replayed:
          type: boolean
          description: a stored decision for this call_id
      required:
      - call_id
      - within_cap
    ActionPolicy:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: the version id (the snapshot key, document.policy_id)
        policy_id:
          $ref: '#/components/schemas/Uuid'
          description: stable across every version of one scope (the first version's id); cumulative counters
            are kept per policy_id
        name:
          type: string
        scope:
          $ref: '#/components/schemas/ActionPolicyScope'
        scope_kind:
          type: string
          enum:
          - tenant
          - agent_group
          - agent
        scope_id: *id017
        version_no:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - draft
          - approved
          - superseded
          - retired
        document:
          type: object
          additionalProperties: true
          description: normalised sibyl-action-policy/1 document
        document_sha256: *id018
        default_effect: *id015
        hold_timeout_s:
          type: integer
          minimum: 10
          maximum: 86400
        four_eyes:
          type: boolean
          description: held actions need two distinct approvers
        approval_four_eyes:
          type: boolean
          description: 'a tier-1 agent is in scope: the author cannot approve'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ActionRuleView'
        change_note:
          type:
          - string
          - 'null'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ActionPolicyApproval'
        created_by: *id001
        approved_by: *id017
        approved_at: *id016
        retired_by: *id017
        retired_at: *id016
        superseded_by: *id017
        superseded_at: *id016
        created_at: *id005
        updated_at: *id005
      required:
      - id
      - policy_id
      - name
      - scope
      - scope_kind
      - version_no
      - state
      - document
      - rules
    ActionPolicyApproval:
      type: object
      properties:
        user_id: *id001
        at: *id005
        reason:
          type:
          - string
          - 'null'
      required:
      - user_id
      - at
      - reason
    ActionPolicyCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_kind:
          type: string
          enum:
          - tenant
          - agent_group
          - agent
        scope_id: *id017
        document:
          type: object
          additionalProperties: true
          description: sibyl-action-policy/1 document (rules, default_effect, hold_timeout_s, sensitive_tools
            …); policy_id and version are assigned, omitted tool lists and limits take their defaults
