        '429':
        - rate_limited
      x-sibyl-actions:
        approve:
          scope: approvals:decide
          audit:
          - approval.granted
          step_up: never
          object_rules:
          - four_eyes
        deny:
          scope: approvals:decide
          audit:
          - approval.denied
          step_up: never
          object_rules:
          - four_eyes
        undo:
          scope: routing:override
          audit:
          - failover.undone
          - config.changed
          - handoff.returned
          step_up: never
          object_rules:
          - group
          note: 'returns open handoff tasks; an undo counts toward the pre-emptive breaker and never clears
            it (B19: POST /agents/{agent_id}/preemptive-breaker/clear)'
        clear_hold:
          scope: routing:override
          audit:
          - override.by_human
          step_up: never
          object_rules:
          - role_owner_or_security_admin
        release:
          scope: quarantine:act
          audit:
          - quarantine.released
          - killswitch.released
          - quarantine.applied
          scope_any:
          - killswitch:release
          step_up: conditional
          note: 'from quarantined: quarantine:act; from killed: killswitch:release with step-up'
        fail_back:
          scope: routing:override
          audit:
          - failback.started
          step_up: never
          object_rules:
          - group
        cancel:
          scope: routing:override
          audit:
          - failover.rolled_back
          step_up: never
          object_rules:
          - group
          - or_requester
