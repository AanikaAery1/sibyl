      - oidc
      x-sibyl-key-scopes: []
      x-sibyl-step-up: always
      x-sibyl-object-rules: []
      x-sibyl-idempotency: required
      x-sibyl-if-match: none
      x-sibyl-rate-limit: tenant_key_rotate
      x-sibyl-problems:
        '401':
        - unauthenticated
        '403':
        - forbidden
        - step_up_required
        - break_glass_key_misuse
        '404':
        - not_found
        '409':
        - idempotency_in_progress
        - idempotent_replay_unavailable
        - hold_blocked
        '422':
        - validation_failed
        - idempotency_key_reuse
        '428':
        - idempotency_key_required
        '429':
        - rate_limited
        - tenant_erasing
      description: Creates version n+1 as active and retires version n in one transaction. Retired versions
        keep decrypting existing objects; nothing is re-encrypted inline. Refused while the tenant is
        erasing.
      security:
      - session: []
      - oidc: []
      parameters:
      - name: purpose
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TenantKeyPurpose'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
