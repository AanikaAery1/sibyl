[project]
name = "sibyl-gateway"
version = "0.1.0.dev0"
description = "Sibyl: OpenAI-compatible gateway"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
# Direct imports only: httpcore (connect-time SSRF guard) and anyio (network backend) are used
# directly, so they are declared rather than inherited from httpx. No web framework: the
# gateway is a plain ASGI app on uvicorn.
dependencies = [
    "sibyl-schemas",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "httpcore>=1.0",
    "anyio>=4.0",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl_gateway"]
