[project]
name = "sibyl-control"
version = "0.1.0.dev0"
description = "Sibyl: control plane (api, ingest, worker, migrate)"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = ["sibyl-schemas", "fastapi>=0.115", "uvicorn>=0.32", "asyncpg>=0.30", "pydantic>=2.9", "pydantic-settings>=2.6", "cryptography>=43", "httpx>=0.27", "pyyaml>=6.0"]

[dependency-groups]
dev = ["openapi-spec-validator>=0.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl_control"]
