[project]
name = "sibyl-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/sibyl-schemas", "packages/sibyl-sdk", "packages/sibyl-mcp", "services/control", "services/gateway", "sibyl-sim"]

[tool.uv.sources]
sibyl-schemas = { workspace = true }
sibyl-sdk = { workspace = true }
sibyl-mcp = { workspace = true }
sibyl-control = { workspace = true }
sibyl-gateway = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest-xdist>=3.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "console"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["packages", "services", "sibyl-sim", "ci"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "serial: asserts a timing budget; ci/run.sh runs it alone after the parallel suite",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
