# gitleaks: the scrubber's test corpora and golden vectors are deliberately secret-shaped fakes
# (generated, never real credentials). Everything else is scanned with the default rules.
[extend]
useDefault = true

[allowlist]
description = "synthetic secret fixtures and test vectors"
paths = [
  '''packages/sibyl-schemas/fixtures/''',
  '''packages/sibyl-schemas/src/sibyl_schemas/scrub/''',
  '''(^|/)tests?/''',
  '''docs/council/build/reviews/G0-tests\.md''',
  '''packages/sibyl-sdk/src/sibyl/(testing|_snapshot)\.py''',
  '''services/gateway/src/sibyl_gateway/credentials/sealing\.py''',
  '''sibyl-sim/''',
]
