[project]
name = "sibyl-schemas"
version = "1.1.0"
description = "Sibyl: frozen wire contracts (value sets, JSON Schemas, models, JCS, secrets scrubber, golden fixtures)"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.14", "jsonschema>=4.23", "referencing>=0.30"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl_schemas"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "sibyl_schemas/_fixtures"
