[project]
name = "sibyl-sdk"
version = "0.1.0.dev0"
description = "Sibyl: Python SDK"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["sibyl-schemas", "httpx>=0.27", "cryptography>=43"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=1.0"]
langchain = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.2"]
crewai = ["crewai>=0.100"]
all = [
  "sibyl-sdk[openai]",
  "sibyl-sdk[anthropic]",
  "sibyl-sdk[google]",
  "sibyl-sdk[langchain]",
  "sibyl-sdk[openai-agents]",
  "sibyl-sdk[crewai]",
]

[project.scripts]
sibyl = "sibyl.cli:main"
sibyl-run = "sibyl.run:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl"]
