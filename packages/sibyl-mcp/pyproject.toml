[project]
name = "sibyl-mcp"
version = "0.1.0.dev0"
description = "Sibyl: MCP server for external monitor agents (read the fleet, submit advisory findings)"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["sibyl-sdk", "mcp>=2.3,<3"]

[project.scripts]
sibyl-mcp = "sibyl_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl_mcp"]
